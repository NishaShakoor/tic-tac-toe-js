<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h2> <b>Tic Tac Toe  </b></h2>
    <h3>Start the Game</h3>

    <div class="btn_container">

        <div class="line_one">
        <div class="btn" id="0" type="button"></div>
        <div class="btn" id="1" type="button"></div>
        <div class="btn" id="2" type="button"></div>
        </div>

        <div class="line_tw0">
        <div class="btn" id="3" type="button"></div>
        <div class="btn" id="4" type="button"></div>
        <div class="btn" id="5" type="button"></div>
        </div>

        <div class="line_three">
        <div class="btn" id="6" type="button"></div>
        <div class="btn" id="7" type="button"></div>
        <div class="btn" id="8" type="button"></div>
        </div>

    </div>

    <button class="reset">Reset Game</button>
    
    <script src="app.js"></script>
</body>
</html>
